<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Accès rapide à l’administration Microsoft 365 de TECH'FUN.">
    <title>Admin TECH'FUN</title>
    <style>
      :root {
        color-scheme: dark;
        --navy-950: #071426;
        --navy-900: #0b1f3a;
        --navy-800: #12345c;
        --blue-400: #67b7ff;
        --blue-200: #c9e7ff;
        --white: #f8fbff;
        --muted: #a8bbd2;
        --line: rgba(201, 231, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 15%, rgba(49, 132, 216, 0.24), transparent 32%),
          radial-gradient(circle at 90% 80%, rgba(23, 86, 151, 0.28), transparent 35%),
          var(--navy-950);
        color: var(--white);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        width: min(100% - 2rem, 720px);
        padding: 1rem 0;
      }

      .card {
        position: relative;
        overflow: hidden;
        padding: clamp(2rem, 7vw, 4.75rem) clamp(1.5rem, 8vw, 5rem);
        border: 1px solid var(--line);
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(18, 52, 92, 0.9), rgba(7, 20, 38, 0.96));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        text-align: center;
      }

      .card::before {
        position: absolute;
        top: -110px;
        right: -85px;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        background: rgba(103, 183, 255, 0.11);
        content: "";
      }

      .brand {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 2rem;
        color: var(--blue-200);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .brand-mark {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        background: var(--blue-400);
        box-shadow: 0 0 18px rgba(103, 183, 255, 0.9);
      }

      h1 {
        position: relative;
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 4.8rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      .intro {
        position: relative;
        max-width: 440px;
        margin: 1.5rem auto 2.5rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
      }

      .button {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        min-width: 220px;
        padding: 0.95rem 1.35rem;
        border: 1px solid transparent;
        border-radius: 12px;
        background: var(--white);
        color: var(--navy-900);
        font-weight: 750;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .button:hover {
        background: var(--blue-200);
        box-shadow: 0 10px 28px rgba(103, 183, 255, 0.2);
        transform: translateY(-2px);
      }

      .button:focus-visible {
        outline: 3px solid var(--blue-400);
        outline-offset: 4px;
      }

      .arrow {
        font-size: 1.2rem;
        line-height: 1;
      }

      footer {
        position: relative;
        margin-top: 2rem;
        color: rgba(201, 231, 255, 0.55);
        font-size: 0.8rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>TECH'FUN</div>
        <h1 id="page-title">Admin TECH'FUN</h1>
        <p class="intro">Accédez rapidement à votre espace d’administration Microsoft 365.</p>
        <a class="button" href="https://admin.microsoft.com" target="_blank" rel="noopener noreferrer">
          Ouvrir Microsoft Admin
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <footer>Portail d’administration</footer>
      </section>
    </main>
  </body>
</html>
